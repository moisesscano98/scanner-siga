<style>
:root{
  --bg:#06111f;
  --panel:#0b1728;
  --green:#10b981;
  --green2:#34d399;
  --amber:#f59e0b;
  --red:#ef4444;
  --text:#f8fafc;
  --muted:#94a3b8;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  padding-top:max(12px,env(safe-area-inset-top));
  background:rgba(6,17,31,.96);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:10;
}
.title strong{
  display:block;
  font-size:14px;
}
.title small{
  display:block;
  margin-top:2px;
  font-size:9px;
  color:var(--muted);
}
.cancel{
  border:none;
  border-radius:12px;
  padding:10px 13px;
  background:#7f1d1d;
  color:white;
  font-size:11px;
  font-weight:900;
}
.camera{
  position:relative;
  flex:1;
  min-height:0;
  background:#000;
  overflow:hidden;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
.statusWrap{
  position:absolute;
  left:10px;
  right:10px;
  bottom:12px;
  display:flex;
  justify-content:center;
}
.status{
  max-width:95%;
  padding:9px 13px;
  border-radius:999px;
  background:rgba(15,23,42,.86);
  border:1px solid rgba(255,255,255,.16);
  font-size:10px;
  font-weight:900;
  backdrop-filter:blur(10px);
}
.status.ok{background:rgba(5,150,105,.9);border-color:#6ee7b7}
.status.wait{background:rgba(180,83,9,.9)}
.status.err{background:rgba(185,28,28,.9)}
.bottom{
  padding:11px 12px max(12px,env(safe-area-inset-bottom));
  background:var(--panel);
  border-top:1px solid rgba(255,255,255,.08);
}
.progress{
  display:flex;
  gap:7px;
  margin-bottom:9px;
}
.step{
  flex:1;
  text-align:center;
  padding:7px 4px;
  border-radius:10px;
  background:#152238;
  color:#64748b;
  font-size:9px;
  font-weight:900;
}
.step.active{background:#172554;color:#93c5fd}
.step.ok{background:#064e3b;color:#6ee7b7}
.controls{
  display:grid;
  grid-template-columns:1fr 105px;
  gap:8px;
}
.capture{
  min-height:48px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#059669,#0ea5a8);
  color:white;
  font-size:12px;
  font-weight:900;
}
.auto{
  border:1px solid rgba(255,255,255,.13);
  border-radius:14px;
  background:#172033;
  color:#cbd5e1;
  font-size:9px;
  font-weight:900;
}
.auto.on{
  background:rgba(16,185,129,.18);
  border-color:rgba(52,211,153,.45);
  color:#6ee7b7;
}
.finish{
  display:none;
  width:100%;
  margin-top:8px;
  min-height:46px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  font-size:11px;
  font-weight:900;
}
.thumbRow{
  display:flex;
  gap:6px;
  margin-top:8px;
  overflow:auto;
}
.thumb{
  width:48px;
  height:64px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.14);
}
.loader{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#06111f;
  z-index:20;
  font-size:12px;
  font-weight:900;
}
.hidden{display:none!important}
</style>

<style>

<body>
<div class="app">
  <div class="top">
    <div class="title">
      <strong>📄 Scanner PRO</strong>
      <small>Hoja completa · autocaptura · 4 páginas</small>
    </div>

    <button class="cancel" onclick="cancelarEscaneo()">
      ✕ Cancelar
    </button>
  </div>

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <canvas id="analysis" class="hidden"></canvas>

    <div id="captureCountdown" class="captureCountdown">3</div>

    <div id="changeSheetBanner" class="changeSheetBanner">
      ✅ Página guardada<br>
      Retira esta hoja y coloca la siguiente.
    </div>

      ✅ Foto guardada.<br>

    </div>

        ⚙️ Preparando cámara...

      ⚙️ Preparando detector...
    </div>
  </div>

  <div class="bottom">
    <div class="progress">
      <div id="s1" class="step active">1</div>
      <div id="s2" class="step">2</div>

      <div id="s4" class="step">4</div>
    </div>

    <div class="controls">
      <button id="btnCapture" class="capture" onclick="capturar(false)">
        📸 Capturar página 1
      </button>

        ⚡ AUTO ON
      </button>
    </div>

    <button id="btnNextPage" class="nextPageBtn" onclick="habilitarSiguientePagina()">
      ➡️ SIGUIENTE PÁGINA
    </button>

      ✅ Usar las 4 páginas
    </button>

    <div id="thumbRow" class="thumbRow"></div>

<script>
let stream = null;
let scanner = null;
let cvReady = false;
let autoCapture = true;
let page = 1;
let pages = [null,null,null,null];
let lastCorners = null;
let stable = 0;
let waitingRemoval = false;
let removalFrames = 0;
let busy = false;
let timer = null;

/*
 * Locks de seguridad V5.
 * Evitan que varios ciclos de analyze() disparen capturas
 * simultáneas mientras corre la cuenta 3-2-1.
 */
let capturePending = false;
let waitingNewSheet = false;
let lastCapturedCorners = null;

/*
 * Máquina de estados V6:
 * READY       = puede detectar/autocapturar
 * CAPTURING   = cuenta/captura en curso
 * WAIT_NEXT   = página guardada; NO puede capturar otra
 * DONE        = 4 páginas listas
 */
let scanState = "READY";
let capturedPageIndex = null;

const ANALYZE_MS = 300;
const ANALYSIS_WIDTH = 640;
const STABLE_FRAMES = 4;
const STABLE_MOVE = 10;
const REMOVAL_FRAMES = 2;

const MIN_COVERAGE = 0.42;
const MAX_COVERAGE = 0.97;
const MIN_ASPECT = 0.46;
const MAX_ASPECT = 0.95;
const MIN_EDGE_BALANCE = 0.52;

/*
 * V3 - objetivo "escaneo limpio":
 * - priorizar el borde EXTERIOR de la hoja
 * - ignorar cuadros/tablas internas
 * - limpiar fondo del papel
 * - mejorar texto sin destruir firmas o sellos
 */
const OUTPUT_LONG = 1980;
const OUTPUT_SHORT = 1400;
const PAPER_WHITE_START = 168;
const PAPER_WHITE_STRENGTH = 0.82;

/*
 * Ajustes V7 PRO
 */
const FINAL_INSET = 0.012;        // recorte final suave ~1.2%
const SHADOW_BLUR = 41;           // corrección de iluminación
const SHARP_AMOUNT = 0.34;        // nitidez
const MIN_DOC_BRIGHTNESS = 118;   // papel mínimo aceptable

function setStatus(text,type="wait"){
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status " + type;
}

function cornersValid(p){
  return !!(
    p &&
    p.topLeftCorner &&
    p.topRightCorner &&
    p.bottomLeftCorner &&
    p.bottomRightCorner
  );
}

function dist(a,b){
  if(!a || !b) return 9999;
  return Math.hypot((a.x||0)-(b.x||0),(a.y||0)-(b.y||0));
}

function movement(a,b){
  if(!cornersValid(a)||!cornersValid(b)) return 9999;
  const ks=["topLeftCorner","topRightCorner","bottomLeftCorner","bottomRightCorner"];
  return ks.reduce((s,k)=>s+dist(a[k],b[k]),0)/4;
}

function polygonArea(p){
  if(!cornersValid(p)) return 0;
  const pts=[p.topLeftCorner,p.topRightCorner,p.bottomRightCorner,p.bottomLeftCorner];
  let area=0;
  for(let i=0;i<4;i++){
    const j=(i+1)%4;
    area += pts[i].x*pts[j].y - pts[j].x*pts[i].y;
  }
  return Math.abs(area/2);
}



/* =====================================================
   DETECTOR PROPIO DE HOJA COMPLETA
   Busca el mayor cuadrilátero EXTERIOR del frame.
===================================================== */

function orderCorners(points){
  if(!Array.isArray(points) || points.length!==4) return null;

  const sum = points.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  const diff = points.slice().sort((a,b)=>(a.x-a.y)-(b.x-b.y));

  return {
    topLeftCorner:sum[0],
    bottomRightCorner:sum[3],
    bottomLeftCorner:diff[0],
    topRightCorner:diff[3]
  };
}

function detectFullSheet(canvas){
  let src=null, gray=null, blur=null, edges=null;
  let kernel=null, contours=null, hierarchy=null;

  try{
    src=cv.imread(canvas);
    gray=new cv.Mat();
    blur=new cv.Mat();
    edges=new cv.Mat();
    contours=new cv.MatVector();
    hierarchy=new cv.Mat();

    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);

    cv.GaussianBlur(
      gray,
      blur,
      new cv.Size(5,5),
      0,
      0,
      cv.BORDER_DEFAULT
    );

    /*
     * Canny detecta los bordes físicos de la hoja.
     * Después cerramos pequeños huecos para formar
     * un contorno exterior continuo.
     */
    cv.Canny(
      blur,
      edges,
      55,
      155
    );

    kernel=cv.Mat.ones(5,5,cv.CV_8U);

    cv.morphologyEx(
      edges,
      edges,
      cv.MORPH_CLOSE,
      kernel
    );

    cv.dilate(
      edges,
      edges,
      kernel
    );

    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );

    const frameArea=canvas.width*canvas.height;
    let best=null;
    let bestArea=0;

    for(let i=0;i<contours.size();i++){
      const contour=contours.get(i);
      const area=cv.contourArea(contour);

      if(area < frameArea*0.20){
        contour.delete();
        continue;
      }

      const peri=cv.arcLength(contour,true);
      const approx=new cv.Mat();

      /*
       * Probamos dos tolerancias.
       * Ayuda cuando una esquina de la hoja no está perfecta.
       */
      cv.approxPolyDP(contour,approx,0.018*peri,true);

      let points=null;

      if(approx.rows===4){
        points=[];
        for(let r=0;r<4;r++){
          const p=approx.intPtr(r,0);
          points.push({x:p[0],y:p[1]});
        }
      }else{
        approx.delete();

        const approx2=new cv.Mat();
        cv.approxPolyDP(contour,approx2,0.03*peri,true);

        if(approx2.rows===4){
          points=[];
          for(let r=0;r<4;r++){
            const p=approx2.intPtr(r,0);
            points.push({x:p[0],y:p[1]});
          }
        }

        approx2.delete();
        contour.delete();

        if(!points) continue;

        const ordered=orderCorners(points);
        const valid=validateDocumentContour(
          ordered,
          canvas.width,
          canvas.height
        );

        if(valid.ok && area>bestArea){
          best=ordered;
          bestArea=area;
        }

        continue;
      }

      approx.delete();
      contour.delete();

      if(!points) continue;

      const ordered=orderCorners(points);
      const valid=validateDocumentContour(
        ordered,
        canvas.width,
        canvas.height
      );

      if(valid.ok && area>bestArea){
        best=ordered;
        bestArea=area;
      }
    }

    return best;

  }catch(err){
    console.warn("Detector de hoja completa:",err);
    return null;
  }finally{
    try{if(src)src.delete()}catch(e){}
    try{if(gray)gray.delete()}catch(e){}
    try{if(blur)blur.delete()}catch(e){}
    try{if(edges)edges.delete()}catch(e){}
    try{if(kernel)kernel.delete()}catch(e){}
    try{if(contours)contours.delete()}catch(e){}
    try{if(hierarchy)hierarchy.delete()}catch(e){}
  }
}


/* =====================================================
   LIMPIEZA TIPO ESCÁNER
   Levanta el papel hacia blanco y mantiene texto/color.
===================================================== */


/* =====================================================
   V7 PRO - RECORTE INTERIOR SUAVE
   Quita pequeños residuos de mesa/piso que puedan quedar
   después de corregir la perspectiva.
===================================================== */

function insetCanvas(inputCanvas,ratio=FINAL_INSET){

  const sx=Math.max(
    0,
    Math.round(inputCanvas.width*ratio)
  );

  const sy=Math.max(
    0,
    Math.round(inputCanvas.height*ratio)
  );

  const sw=Math.max(
    1,
    inputCanvas.width-(sx*2)
  );

  const sh=Math.max(
    1,
    inputCanvas.height-(sy*2)
  );

  const out=document.createElement("canvas");
  out.width=inputCanvas.width;
  out.height=inputCanvas.height;

  const ctx=out.getContext("2d",{alpha:false});
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,out.width,out.height);

  ctx.drawImage(
    inputCanvas,
    sx,sy,sw,sh,
    0,0,out.width,out.height
  );

  return out;
}


/* =====================================================
   V7 PRO - AUTO ORIENTACIÓN
   Mantiene el documento en orientación natural.
===================================================== */

function normalizeOrientation(inputCanvas){

  /*
   * Si el resultado es demasiado ancho, lo rotamos
   * para dejarlo vertical, que es la orientación habitual
   * de los informes.
   */
  if(
    inputCanvas.width <=
    inputCanvas.height
  ){
    return inputCanvas;
  }

  const out=document.createElement("canvas");

  out.width=inputCanvas.height;
  out.height=inputCanvas.width;

  const ctx=out.getContext("2d",{alpha:false});

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,out.width,out.height);

  ctx.translate(
    out.width/2,
    out.height/2
  );

  ctx.rotate(
    Math.PI/2
  );

  ctx.drawImage(
    inputCanvas,
    -inputCanvas.width/2,
    -inputCanvas.height/2
  );

  return out;
}


/* =====================================================
   V7 PRO - CORRECCIÓN DE SOMBRAS / ILUMINACIÓN
===================================================== */

function normalizeLightingCanvas(inputCanvas){

  if(!window.cv){
    return inputCanvas;
  }

  const out=document.createElement("canvas");
  out.width=inputCanvas.width;
  out.height=inputCanvas.height;

  const ctx=out.getContext("2d",{alpha:false});
  ctx.drawImage(inputCanvas,0,0);

  let src=null;
  let lab=null;
  let channels=null;
  let l=null;
  let blur=null;
  let norm=null;
  let merged=null;

  try{

    src=cv.imread(out);

    lab=new cv.Mat();

    cv.cvtColor(
      src,
      lab,
      cv.COLOR_RGBA2RGB
    );

    cv.cvtColor(
      lab,
      lab,
      cv.COLOR_RGB2Lab
    );

    channels=new cv.MatVector();

    cv.split(
      lab,
      channels
    );

    l=channels.get(0);

    blur=new cv.Mat();

    cv.GaussianBlur(
      l,
      blur,
      new cv.Size(
        SHADOW_BLUR,
        SHADOW_BLUR
      ),
      0
    );

    norm=new cv.Mat();

    /*
     * Divide iluminación local:
     * papel oscuro por sombra → se aclara
     * texto oscuro → conserva contraste
     */
    cv.divide(
      l,
      blur,
      norm,
      255
    );

    const newChannels=
      new cv.MatVector();

    newChannels.push_back(norm);
    newChannels.push_back(channels.get(1));
    newChannels.push_back(channels.get(2));

    merged=new cv.Mat();

    cv.merge(
      newChannels,
      merged
    );

    cv.cvtColor(
      merged,
      merged,
      cv.COLOR_Lab2RGB
    );

    cv.cvtColor(
      merged,
      merged,
      cv.COLOR_RGB2RGBA
    );

    cv.imshow(
      out,
      merged
    );

    newChannels.delete();

  }catch(e){

    console.warn(
      "Corrección de iluminación no disponible:",
      e
    );

  }finally{

    try{if(src)src.delete()}catch(e){}
    try{if(lab)lab.delete()}catch(e){}
    try{if(channels)channels.delete()}catch(e){}
    try{if(l)l.delete()}catch(e){}
    try{if(blur)blur.delete()}catch(e){}
    try{if(norm)norm.delete()}catch(e){}
    try{if(merged)merged.delete()}catch(e){}

  }

  return out;
}


function cleanDocumentCanvas(inputCanvas){

  /*
   * Pipeline:
   * 1) recorte interior mínimo
   * 2) orientación
   * 3) iluminación uniforme
   * 4) nitidez
   * 5) blanqueo inteligente
   */

  let working=
    insetCanvas(
      inputCanvas
    );

  const oriented=
    normalizeOrientation(
      working
    );

  if(oriented!==working){
    working.width=1;
    working.height=1;
    working=oriented;
  }

  const lit=
    normalizeLightingCanvas(
      working
    );

  if(lit!==working){
    working.width=1;
    working.height=1;
    working=lit;
  }

  const out=document.createElement("canvas");
  out.width=working.width;
  out.height=working.height;

  const ctx=out.getContext(
    "2d",
    {alpha:false}
  );

  ctx.fillStyle="#fff";
  ctx.fillRect(
    0,0,
    out.width,
    out.height
  );

  ctx.drawImage(
    working,
    0,0
  );


  // ==========================================
  // NITIDEZ SUAVE TIPO ESCÁNER
  // ==========================================

  let src=null;
  let blur=null;
  let sharp=null;

  try{

    src=
      cv.imread(
        out
      );

    blur=
      new cv.Mat();

    sharp=
      new cv.Mat();

    cv.GaussianBlur(
      src,
      blur,
      new cv.Size(0,0),
      1.05,
      1.05,
      cv.BORDER_DEFAULT
    );

    cv.addWeighted(
      src,
      1+SHARP_AMOUNT,
      blur,
      -SHARP_AMOUNT,
      1,
      sharp
    );

    cv.imshow(
      out,
      sharp
    );

  }catch(e){

    console.warn(
      "Nitidez PRO:",
      e
    );

  }finally{

    try{if(src)src.delete()}catch(e){}
    try{if(blur)blur.delete()}catch(e){}
    try{if(sharp)sharp.delete()}catch(e){}

  }


  // ==========================================
  // BLANQUEO INTELIGENTE DEL PAPEL
  // ==========================================

  try{

    const image=
      ctx.getImageData(
        0,0,
        out.width,
        out.height
      );

    const d=
      image.data;

    for(
      let i=0;
      i<d.length;
      i+=4
    ){

      let r=d[i];
      let g=d[i+1];
      let b=d[i+2];

      const lum=
        0.2126*r+
        0.7152*g+
        0.0722*b;

      /*
       * Fondos claros → blanco limpio.
       */
      if(
        lum>=PAPER_WHITE_START
      ){

        const t=
          Math.min(
            1,
            Math.max(
              0,
              (lum-PAPER_WHITE_START)/
              (255-PAPER_WHITE_START)
            )
          );

        const lift=
          PAPER_WHITE_STRENGTH*
          (
            0.58+
            0.42*t
          );

        r=
          r+
          (255-r)*lift;

        g=
          g+
          (255-g)*lift;

        b=
          b+
          (255-b)*lift;

      }else{

        /*
         * Texto y líneas:
         * un poco más de contraste.
         */
        const k=
          1.075;

        r=
          128+
          (r-128)*k;

        g=
          128+
          (g-128)*k;

        b=
          128+
          (b-128)*k;

      }

      d[i]=
        Math.max(
          0,
          Math.min(
            255,
            r
          )
        );

      d[i+1]=
        Math.max(
          0,
          Math.min(
            255,
            g
          )
        );

      d[i+2]=
        Math.max(
          0,
          Math.min(
            255,
            b
          )
        );

    }

    ctx.putImageData(
      image,
      0,0
    );

  }catch(e){

    console.warn(
      "Blanqueo PRO:",
      e
    );

  }

  try{
    working.width=1;
    working.height=1;
  }catch(e){}

  return out;
}


/* =====================================================
   TAMAÑO DE SALIDA SEGÚN ORIENTACIÓN DEL DOCUMENTO
===================================================== */

function outputSizeFromCorners(p){
  if(!cornersValid(p)){
    return {width:OUTPUT_SHORT,height:OUTPUT_LONG};
  }

  const d=(a,b)=>Math.hypot(
    (a.x||0)-(b.x||0),
    (a.y||0)-(b.y||0)
  );

  const w=(d(p.topLeftCorner,p.topRightCorner)+
           d(p.bottomLeftCorner,p.bottomRightCorner))/2;

  const h=(d(p.topLeftCorner,p.bottomLeftCorner)+
           d(p.topRightCorner,p.bottomRightCorner))/2;

  if(w>h){
    return {width:OUTPUT_LONG,height:OUTPUT_SHORT};
  }

  return {width:OUTPUT_SHORT,height:OUTPUT_LONG};
}



function nearFrameEdgeCount(p,width,height){
  if(!cornersValid(p)) return 4;

  const pts=[
    p.topLeftCorner,
    p.topRightCorner,
    p.bottomRightCorner,
    p.bottomLeftCorner
  ];

  const mx=width*0.025;
  const my=height*0.025;

  return pts.filter(q =>
    q.x<=mx ||
    q.x>=width-mx ||
    q.y<=my ||
    q.y>=height-my
  ).length;
}


function documentBrightness(canvas,p){
  if(!cornersValid(p) || !window.cv) return null;

  let src=null, gray=null, mask=null;

  try{
    src=cv.imread(canvas);
    gray=new cv.Mat();
    mask=cv.Mat.zeros(src.rows,src.cols,cv.CV_8UC1);

    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);

    const pts=[
      p.topLeftCorner,
      p.topRightCorner,
      p.bottomRightCorner,
      p.bottomLeftCorner
    ];

    const data=[];
    pts.forEach(q=>{
      data.push(Math.round(q.x),Math.round(q.y));
    });

    const contour=cv.matFromArray(
      4,
      1,
      cv.CV_32SC2,
      data
    );

    const contours=new cv.MatVector();
    contours.push_back(contour);

    cv.fillPoly(
      mask,
      contours,
      new cv.Scalar(255)
    );

    const mean=cv.mean(gray,mask)[0];

    contour.delete();
    contours.delete();

    return mean;

  }catch(e){
    return null;
  }finally{
    try{if(src)src.delete()}catch(e){}
    try{if(gray)gray.delete()}catch(e){}
    try{if(mask)mask.delete()}catch(e){}
  }
}


function validateDocumentContour(p,width,height){
  if(!cornersValid(p)) return {ok:false,reason:"No se detectaron cuatro esquinas."};

  const pts=[p.topLeftCorner,p.topRightCorner,p.bottomRightCorner,p.bottomLeftCorner];

  const inside=pts.every(q =>
    Number.isFinite(Number(q.x)) &&
    Number.isFinite(Number(q.y)) &&
    q.x>=0 && q.y>=0 && q.x<=width && q.y<=height
  );
  if(!inside) return {ok:false,reason:"Contorno fuera de cámara."};

  const coverage=polygonArea(p)/(width*height);
  if(coverage<MIN_COVERAGE){
    return {ok:false,reason:"Rectángulo demasiado pequeño.",coverage};
  }
  if(coverage>MAX_COVERAGE){
    return {ok:false,reason:"Separa ligeramente la cámara.",coverage};
  }

  const d=(a,b)=>Math.hypot((a.x||0)-(b.x||0),(a.y||0)-(b.y||0));
  const top=d(p.topLeftCorner,p.topRightCorner);
  const bottom=d(p.bottomLeftCorner,p.bottomRightCorner);
  const left=d(p.topLeftCorner,p.bottomLeftCorner);
  const right=d(p.topRightCorner,p.bottomRightCorner);

  const avgW=(top+bottom)/2;
  const avgH=(left+right)/2;
  if(avgW<=0 || avgH<=0) return {ok:false,reason:"Contorno inválido."};

  const aspect=avgW/avgH;
  if(aspect<MIN_ASPECT || aspect>MAX_ASPECT){
    return {ok:false,reason:"No tiene forma de hoja.",aspect};
  }

  const hb=Math.min(top,bottom)/Math.max(top,bottom);
  const vb=Math.min(left,right)/Math.max(left,right);
  if(hb<MIN_EDGE_BALANCE || vb<MIN_EDGE_BALANCE){
    return {ok:false,reason:"Perspectiva demasiado extrema."};
  }

  const cx=pts.reduce((s,q)=>s+q.x,0)/4;
  const cy=pts.reduce((s,q)=>s+q.y,0)/4;
  const dx=Math.abs(cx-width/2)/width;
  const dy=Math.abs(cy-height/2)/height;
  if(dx>0.28 || dy>0.28){
    return {ok:false,reason:"Centra mejor la hoja."};
  }

  /*
   * Evita que el detector tome como documento el marco completo
   * de la mesa/piso/pantalla. Si demasiadas esquinas están pegadas
   * al borde del video, no lo aceptamos como hoja.
   */
  const edgeCount=
    nearFrameEdgeCount(
      p,
      width,
      height
    );

  if(edgeCount>=2){
    return {
      ok:false,
      reason:"Veo el entorno, no la hoja completa."
    };
  }

  return {ok:true,coverage,aspect};
}

function scaleCorners(p,sx,sy){
  if(!cornersValid(p)) return null;
  const c=q=>({x:q.x*sx,y:q.y*sy});
  return {
    topLeftCorner:c(p.topLeftCorner),
    topRightCorner:c(p.topRightCorner),
    bottomLeftCorner:c(p.bottomLeftCorner),
    bottomRightCorner:c(p.bottomRightCorner)
  };
}

function drawOverlay(corners){
  const overlay=document.getElementById("overlay");
  const ctx=overlay.getContext("2d");
  ctx.clearRect(0,0,overlay.width,overlay.height);

  if(!cornersValid(corners)){
    const mx=overlay.width*.12;
    const my=overlay.height*.06;
    ctx.strokeStyle="rgba(255,255,255,.38)";
    ctx.lineWidth=Math.max(3,overlay.width*.004);
    ctx.setLineDash([18,13]);
    ctx.strokeRect(mx,my,overlay.width-mx*2,overlay.height-my*2);
    ctx.setLineDash([]);
    return;
  }

  const p=corners;
  ctx.beginPath();
  ctx.moveTo(p.topLeftCorner.x,p.topLeftCorner.y);
  ctx.lineTo(p.topRightCorner.x,p.topRightCorner.y);
  ctx.lineTo(p.bottomRightCorner.x,p.bottomRightCorner.y);
  ctx.lineTo(p.bottomLeftCorner.x,p.bottomLeftCorner.y);
  ctx.closePath();

  ctx.fillStyle="rgba(16,185,129,.08)";
  ctx.fill();
  ctx.strokeStyle="#34d399";
  ctx.lineWidth=Math.max(4,overlay.width*.005);
  ctx.shadowColor="rgba(16,185,129,.9)";
  ctx.shadowBlur=14;
  ctx.stroke();
  ctx.shadowBlur=0;
}

function updateUI(){

  for(let i=1;i<=4;i++){
    const el=document.getElementById("s"+i);
    el.className="step";

    if(pages[i-1]){
      el.classList.add("ok");
    }else if(i===page && scanState!=="DONE"){
      el.classList.add("active");
    }
  }

  const cap=document.getElementById("btnCapture");

  if(scanState==="WAIT_NEXT"){
    cap.textContent="✅ Página guardada";
    cap.disabled=true;
  }else if(scanState==="DONE"){
    cap.textContent="✅ 4 páginas completas";
    cap.disabled=true;
  }else{
    cap.textContent=page<=4 ? `📸 Capturar página ${page}` : "✅ Completado";
    cap.disabled=page>4 || scanState!=="READY";
  }

  const nextBtn=document.getElementById("btnNextPage");
  if(nextBtn){
    nextBtn.classList.toggle(
      "show",
      scanState==="WAIT_NEXT"
    );

    if(scanState==="WAIT_NEXT"){
      nextBtn.innerHTML=
        `➡️ YA CAMBIÉ LA HOJA — IR A PÁGINA ${page}`;
    }
  }

  const finish=document.getElementById("btnFinish");
  const completo=pages.every(Boolean);

  finish.style.display=completo ? "block" : "none";
  finish.classList.toggle("ready",completo);

  if(completo){
    finish.innerHTML="✅ TERMINAR Y REGRESAR AL SISTEMA";
  }

  const locked=document.getElementById("pageLocked");
  if(locked){
    locked.classList.toggle(
      "show",
      scanState==="WAIT_NEXT"
    );
  }
}

async function waitOpenCV(){
  const start=Date.now();
  while(Date.now()-start < 18000){
    try{
      if(window.cv && typeof cv.imread==="function" && typeof window.jscanify==="function"){
        scanner=new jscanify();
        cvReady=true;
        return true;
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,250));
  }
  return false;
}

async function start(){
  const ok=await waitOpenCV();
  document.getElementById("loader").classList.add("hidden");

  if(!ok){
    setStatus("⚠️ Detector no disponible. Puedes capturar manualmente.","wait");
  }

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    const video=document.getElementById("video");
    video.srcObject=stream;
    await video.play();

    const overlay=document.getElementById("overlay");
    overlay.width=video.videoWidth;
    overlay.height=video.videoHeight;

    const analysis=document.getElementById("analysis");
    const sc=Math.min(1,ANALYSIS_WIDTH/video.videoWidth);
    analysis.width=Math.max(1,Math.round(video.videoWidth*sc));
    analysis.height=Math.max(1,Math.round(video.videoHeight*sc));

    timer=setInterval(analyze,ANALYZE_MS);
    setStatus("📄 Coloca el documento dentro del marco","wait");
  }catch(err){
    document.getElementById("loader").classList.add("hidden");
    setStatus("❌ No se pudo abrir la cámara.","err");
    alert("No se pudo abrir la cámara. Revisa permisos del navegador.");
  }
}

async function analyze(){

  /*
   * CRÍTICO:
   * capturePending se activa ANTES de la cuenta 3-2-1.
   * Así ningún otro intervalo puede iniciar otra captura.
   */
  if(
    scanState!=="READY" ||
    busy ||
    capturePending ||
    !cvReady ||
    !scanner ||
    page>4
  ){
    return;
  }

  const video=document.getElementById("video");
  const analysis=document.getElementById("analysis");
  if(video.readyState<2) return;

  const ctx=analysis.getContext("2d",{alpha:false});
  ctx.drawImage(video,0,0,analysis.width,analysis.height);

  let corners=null;

  /*
   * Primero usamos nuestro detector de hoja completa.
   * Sólo si no encuentra nada recurrimos a jscanify.
   */
  corners=detectFullSheet(analysis);

  if(!corners){
    let mat=null, contour=null;

    try{
      mat=cv.imread(analysis);
      contour=scanner.findPaperContour(mat);
      const candidate=scanner.getCornerPoints(contour);

      if(
        validateDocumentContour(
          candidate,
          analysis.width,
          analysis.height
        ).ok
      ){
        corners=candidate;
      }

    }catch(e){
      corners=null;
    }finally{
      try{if(mat)mat.delete()}catch(e){}
      try{if(contour)contour.delete()}catch(e){}
    }
  }

  if(!cornersValid(corners)){

    stable=0;
    lastCorners=null;
    drawOverlay(null);

    /*
     * Cuando acabamos de capturar una página,
     * necesitamos ver la hoja DESAPARECER varios ciclos.
     * Sólo entonces habilitamos la página siguiente.
     */
    if(waitingRemoval || waitingNewSheet){

      removalFrames++;

      setStatus(
        "🔄 Retira la hoja anterior...",
        "wait"
      );

      const banner=
        document.getElementById(
          "changeSheetBanner"
        );

      if(banner){
        banner.classList.add("show");
      }

      if(
        removalFrames>=REMOVAL_FRAMES
      ){

        waitingRemoval=false;
        waitingNewSheet=false;
        removalFrames=0;
        lastCapturedCorners=null;

        if(banner){
          banner.classList.remove("show");
        }

        setStatus(
          `📄 Ahora coloca la página ${page}`,
          "wait"
        );

      }

    }else{

      setStatus(
        "📄 Coloca la hoja completa dentro del marco",
        "wait"
      );

    }

    return;
  }

  const valid=validateDocumentContour(corners,analysis.width,analysis.height);

  /*
   * Comprobación extra: el interior del cuadrilátero debe parecer
   * papel/documento, no mesa o piso.
   */
  if(valid.ok){

    const brillo=
      documentBrightness(
        analysis,
        corners
      );

    if(
      brillo !== null &&
      brillo < MIN_DOC_BRIGHTNESS
    ){
      valid.ok=false;
      valid.reason="El área detectada no parece una hoja.";
    }

  }

  if(!valid.ok){
    stable=0;
    lastCorners=null;
    drawOverlay(null);

    if(valid.coverage && valid.coverage<MIN_COVERAGE){
      setStatus("🔎 Aún no veo la hoja completa. Acércala y deja visibles sus 4 bordes.","wait");
    }else{
      setStatus("🟡 "+valid.reason,"wait");
    }
    return;
  }

  const mv=movement(corners,lastCorners);
  stable = mv<=STABLE_MOVE ? stable+1 : 0;
  lastCorners=corners;

  const scaled=scaleCorners(
    corners,
    video.videoWidth/analysis.width,
    video.videoHeight/analysis.height
  );
  drawOverlay(scaled);

  if(waitingRemoval || waitingNewSheet){

    stable=0;
    lastCorners=null;

    const banner=
      document.getElementById(
        "changeSheetBanner"
      );

    if(banner){
      banner.classList.add("show");
    }

    setStatus(
      `✅ Página ${page-1} guardada · RETIRA ESTA HOJA`,
      "ok"
    );

    /*
     * Aunque la misma hoja siga perfectamente detectada,
     * no permitimos otra captura hasta que desaparezca
     * del encuadre por REMOVAL_FRAMES ciclos.
     */
    return;
  }

  if(stable>=STABLE_FRAMES){

    if(autoCapture){

      /*
       * Lock inmediato.
       * Sin esto, setInterval podía entrar 2, 3 o 4 veces
       * durante la cuenta 3-2-1 y fotografiar la misma hoja.
       */
      capturePending=true;
      scanState="CAPTURING";

      setStatus(
        "🟢 Hoja estable · captura automática",
        "ok"
      );

      stable=0;

      try{

        await cuentaRegresivaCaptura_();

        if(
          !busy &&
          page<=4
        ){

          await capturar(
            true,
            scaled
          );

        }

      }finally{

        capturePending=false;

        /*
         * capturar() cambia el estado a WAIT_NEXT o DONE.
         * Sólo si la captura falló regresamos a READY.
         */
        if(scanState==="CAPTURING"){
          scanState="READY";
        }

        updateUI();

      }

    }else{

      setStatus(
        "🟢 Hoja lista · puedes capturar",
        "ok"
      );

    }

  }else{

    const faltan=
      Math.max(
        1,
        STABLE_FRAMES-stable
      );

    setStatus(
      "🟢 Hoja completa detectada · no muevas el teléfono" +
      (autoCapture ? ` (${faltan})` : ""),
      "ok"
    );

  }
}


async function cuentaRegresivaCaptura_(){

  const el=
    document.getElementById(
      "captureCountdown"
    );

  if(!el) return;

  el.classList.add("show");

  for(
    const n of [3,2,1]
  ){

    el.textContent=String(n);

    await new Promise(
      r=>setTimeout(r,260)
    );

  }

  el.classList.remove("show");
}


async function capturar(automatic=false, corners=null){

  if(
    busy ||
    page>4 ||
    (
      !automatic &&
      scanState!=="READY"
    )
  ){
    return;
  }

  scanState="CAPTURING";
  busy=true;

  try{
    const video=document.getElementById("video");
    const canvas=document.createElement("canvas");
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    const ctx=canvas.getContext("2d",{alpha:false});
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    let resultCanvas=null;
    let finalCorners=corners;

    /*
     * Si la captura fue manual y no tenemos esquinas,
     * intentamos detectar nuevamente sobre el frame completo.
     */
    if(
      cvReady &&
      scanner &&
      !cornersValid(finalCorners)
    ){
      finalCorners=detectFullSheet(canvas);
    }

    if(
      cvReady &&
      scanner &&
      cornersValid(finalCorners)
    ){
      try{
        const outSize=outputSizeFromCorners(finalCorners);

        resultCanvas=scanner.extractPaper(
          canvas,
          outSize.width,
          outSize.height,
          finalCorners
        );
      }catch(e){
        resultCanvas=null;
      }
    }

    let dataUrl;

    if(resultCanvas){
      /*
       * Procesamiento tipo escáner:
       * - papel más blanco
       * - texto más definido
       * - colores y firmas conservados
       */
      const cleaned=cleanDocumentCanvas(resultCanvas);

      dataUrl=cleaned.toDataURL(
        "image/jpeg",
        .95
      );

      cleaned.width=1;
      cleaned.height=1;

      try{
        resultCanvas.width=1;
        resultCanvas.height=1;
      }catch(e){}

    }else{
      /*
       * Fallback seguro: NO deformar si la hoja no fue detectada.
       */
      const max=1800;
      const sc=Math.min(1,max/Math.max(canvas.width,canvas.height));
      const small=document.createElement("canvas");
      small.width=Math.round(canvas.width*sc);
      small.height=Math.round(canvas.height*sc);

      const sctx=small.getContext("2d",{alpha:false});
      sctx.fillStyle="#fff";
      sctx.fillRect(0,0,small.width,small.height);
      sctx.drawImage(canvas,0,0,small.width,small.height);

      dataUrl=small.toDataURL(
        "image/jpeg",
        .90
      );
    }

    const paginaCapturada=
      page-1;

    pages[paginaCapturada]=
      dataUrl;

    capturedPageIndex=
      paginaCapturada;

    addThumb(
      dataUrl,
      paginaCapturada
    );

    /*
     * Buscar siguiente página faltante.
     * IMPORTANTE: NO la armamos automáticamente.
     */
    const siguienteFaltante=
      pages.findIndex(
        p=>!p
      );

    if(siguienteFaltante===-1){

      page=5;
      scanState="DONE";

    }else{

      page=
        siguienteFaltante+1;

      scanState="WAIT_NEXT";

    }

    waitingRemoval=false;
    waitingNewSheet=false;
    removalFrames=0;
    stable=0;
    lastCorners=null;
    lastCapturedCorners=
      finalCorners || null;

    updateUI();

    const banner=
      document.getElementById(
        "changeSheetBanner"
      );

    if(scanState==="DONE"){

      if(banner){
        banner.classList.remove("show");
      }

      setStatus(
        "✅ 4 de 4 páginas listas · pulsa TERMINAR Y REGRESAR",
        "ok"
      );

      const finish=
        document.getElementById(
          "btnFinish"
        );

      if(finish){
        setTimeout(
          ()=>
            finish.scrollIntoView({
              behavior:"smooth",
              block:"center"
            }),
          120
        );
      }

    }else{

      if(banner){
        banner.classList.remove("show");
      }

      setStatus(
        `✅ Página ${paginaCapturada+1} guardada · cambia la hoja`,
        "ok"
      );

    }
  }catch(err){

    console.error(err);

    scanState="READY";

    setStatus(
      "❌ No se pudo procesar la página · intenta nuevamente",
      "err"
    );

  }finally{

    busy=false;
    updateUI();

  }

}

function addThumb(dataUrl,pageIndex){

  const row=
    document.getElementById(
      "thumbRow"
    );

  let item=
    document.getElementById(
      "thumbItem"+pageIndex
    );

  if(!item){

    item=
      document.createElement(
        "div"
      );

    item.className=
      "thumbItem";

    item.id=
      "thumbItem"+pageIndex;

    item.innerHTML=`
      <img class="thumb" alt="Página ${pageIndex+1}">
      <button
        type="button"
        class="thumbRetake"
        onclick="repetirPagina(${pageIndex})"
      >
        ↻ Repetir
      </button>
    `;

    row.appendChild(
      item
    );

  }

  const img=
    item.querySelector(
      "img"
    );

  img.src=
    dataUrl;
}



function habilitarSiguientePagina(){

  if(scanState!=="WAIT_NEXT"){
    return;
  }

  scanState="READY";
  capturePending=false;
  busy=false;
  stable=0;
  lastCorners=null;
  lastCapturedCorners=null;

  const locked=
    document.getElementById(
      "pageLocked"
    );

  if(locked){
    locked.classList.remove("show");
  }

  setStatus(
    `📄 Página ${page}: coloca la hoja completa`,
    "wait"
  );

  updateUI();
}


function repetirPagina(index){

  if(
    busy ||
    index<0 ||
    index>3
  ){
    return;
  }

  pages[index]=null;

  page=
    index+1;

  scanState="READY";

  waitingRemoval=false;
  waitingNewSheet=false;
  capturePending=false;
  removalFrames=0;
  stable=0;
  lastCorners=null;
  lastCapturedCorners=null;

  const banner=
    document.getElementById(
      "changeSheetBanner"
    );

  if(banner){
    banner.classList.remove("show");
  }

  const item=
    document.getElementById(
      "thumbItem"+index
    );

  if(item){
    item.remove();
  }

  /*
   * Si se repite una página anterior, conservamos las posteriores
   * ya capturadas. Al terminar esta foto, buscamos la siguiente
   * página faltante automáticamente.
   */
  updateUI();

  setStatus(
    `↻ Repite la página ${page}. Coloca nuevamente la hoja.`,
    "wait"
  );
}

function toggleAuto(){
  autoCapture=!autoCapture;
  const btn=document.getElementById("btnAuto");
  btn.classList.toggle("on",autoCapture);
  btn.textContent=autoCapture ? "⚡ AUTO ON" : "⚡ AUTO OFF";
}

function detenerCamara(){
  if(timer){
    clearInterval(timer);
    timer=null;
  }
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
}

function cancelarEscaneo(){
  detenerCamara();

  try{
    if(window.opener){
      window.opener.postMessage({
        type:"SCANNER_PRO_CANCEL"
      },"*");
    }
  }catch(e){}

  if(history.length>1){
    history.back();
    setTimeout(()=>window.close(),250);
  }else{
    window.close();
  }
}

function enviarResultado(){

  if(
    pages.length!==4 ||
    !pages.every(Boolean)
  ){
    alert("Faltan páginas por capturar.");
    return;
  }

  setStatus(
    "✅ Regresando al sistema...",
    "ok"
  );

  detenerCamara();

  const payload={
    type:"SCANNER_PRO_RESULT",
    pages:pages
  };

  let enviado=false;

  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(
        payload,
        "*"
      );

      try{
        window.opener.focus();
      }catch(e){}

      enviado=true;
    }

  }catch(e){
    console.warn(
      "No se pudo usar window.opener:",
      e
    );
  }

  /*
   * Intentamos cerrar la pestaña del Scanner PRO.
   * En iPhone Safari puede no permitir window.close().
   * Si no cierra, retrocedemos a la aplicación.
   */
  if(enviado){

    setTimeout(
      function(){

        try{
          window.close();
        }catch(e){}

        setTimeout(
          function(){
            if(!window.closed && history.length>1){
              history.back();
            }
          },
          350
        );

      },
      250
    );

  }else{

    /*
     * Si Safari eliminó window.opener, al menos permitimos
     * regresar visualmente. Mostramos aviso porque las imágenes
     * no pueden cruzar de origen sin opener.
     */
    alert(
      "Las 4 páginas están listas. Regresaremos al sistema. Si no aparecen automáticamente, vuelve a abrir el escáner desde la aplicación."
    );

    if(history.length>1){
      history.back();
    }

  }
}

window.addEventListener("beforeunload",detenerCamara);
start();
</script>
